<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable · Euleria 3D</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #f1f5f9; --muted: #94a3b8; --accent: #818cf8; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 28rem; text-align: center; }
      .code { font-size: 4rem; font-weight: 800; color: var(--accent); margin: 0; line-height: 1; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
      a { display: inline-block; padding: 0.75rem 1.25rem; border-radius: 0.5rem; background: var(--accent);
        color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Cette page n’existe pas</h1>
      <p>Le lien est peut-être incomplet ou la page a été déplacée.<br />This page does not exist.</p>
      <a href="/">Retour à l’accueil d’Euleria 3D</a>
    </main>
  </body>
</html>
